<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的旅行小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-12">
    <div class="max-w-md mx-auto p-4">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-indigo-600">✈️ 旅行行程與花費</h1>
        </header>

        <!-- 行程區塊 -->
        <section class="mb-8 bg-white p-4 rounded-xl shadow-sm">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">📅 行程記錄</h2>
            <div id="itinerary-list" class="space-y-2 mb-4">
                <!-- 動態插入行程 -->
            </div>
            <div class="space-y-2">
                <input type="text" id="itinerary-time" placeholder="時間 (例如: 10:00)" class="w-full p-2 border rounded-lg text-sm">
                <input type="text" id="itinerary-desc" placeholder="行程內容 (例如: 淺草寺參拜)" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="addItinerary()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium text-sm">新增行程</button>
            </div>
        </section>

        <!-- 花費區塊 -->
        <section class="bg-white p-4 rounded-xl shadow-sm">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">💰 花費記錄</h2>
            <div class="flex justify-between font-bold text-sm mb-3 text-gray-600">
                <span>總支出：<span id="total-cost" class="text-indigo-600">0</span> JPY</span>
            </div>
            <div id="expense-list" class="space-y-2 mb-4 text-sm">
                <!-- 動態插入花費 -->
            </div>
            <div class="space-y-2">
                <input type="text" id="expense-item" placeholder="項目 (例如: 午餐拉麵)" class="w-full p-2 border rounded-lg text-sm">
                <input type="number" id="expense-amount" placeholder="金額 (JPY)" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="addExpense()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium text-sm">新增花費</button>
            </div>
        </section>
    </div>

    <script>
        // 簡單的 LocalStorage 示範（若要雙人同步可改接 Firebase）
        let itineraries = JSON.parse(localStorage.getItem('itineraries')) || [];
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        function render() {
            // 渲染行程
            const itiList = document.getElementById('itinerary-list');
            itiList.innerHTML = itineraries.map((item, index) => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm">
                    <span><strong>[${item.time}]</strong> ${item.desc}</span>
                    <button onclick="deleteItinerary(${index})" class="text-red-500 text-xs">刪除</button>
                </div>
            `).join('') || '<p class="text-gray-400 text-xs text-center">尚無行程</p>';

            // 渲染花費
            const expList = document.getElementById('expense-list');
            let total = 0;
            expList.innerHTML = expenses.map((item, index) => {
                total += Number(item.amount);
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                        <span>${item.name}</span>
                        <span class="text-gray-600">¥${item.amount} <button onclick="deleteExpense(${index})" class="text-red-500 text-xs ml-2">刪除</button></span>
                    </div>
                `;
            }).join('') || '<p class="text-gray-400 text-xs text-center">尚無花費</p>';

            document.getElementById('total-cost').innerText = total;
            localStorage.setItem('itineraries', JSON.stringify(itineraries));
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        function addItinerary() {
            const time = document.getElementById('itinerary-time').value;
            const desc = document.getElementById('itinerary-desc').value;
            if(!time || !desc) return alert('請填寫完整');
            itineraries.push({ time, desc });
            document.getElementById('itinerary-time').value = '';
            document.getElementById('itinerary-desc').value = '';
            render();
        }

        function addExpense() {
            const name = document.getElementById('expense-item').value;
            const amount = document.getElementById('expense-amount').value;
            if(!name || !amount) return alert('請填寫完整');
            expenses.push({ name, amount });
            document.getElementById('expense-item').value = '';
            document.getElementById('expense-amount').value = '';
            render();
        }

        function deleteItinerary(index) {
            itineraries.splice(index, 1);
            render();
        }

        function deleteExpense(index) {
            expenses.splice(index, 1);
            render();
        }

        render();
    </script>
</body>
</html>
