<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ 函館悠閒三日遊 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #e0f2fe;
            user-select: none;
            -webkit-user-select: none;
        }
        .scroll-area {
            flex: 1;
            padding-bottom: 90px; 
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 9999px;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 12px;
            font-weight: bold;
            color: #0284c7;
        }
    </style>
</head>
<body id="body-theme" class="bg-sky-100 text-slate-700 flex flex-col items-center min-h-screen transition-colors duration-500">

    <!-- 主容器 -->
    <div id="app-container" class="w-full sm:max-w-md min-h-screen sm:min-h-[92vh] sm:my-4 sm:rounded-3xl sm:border-4 sm:border-white bg-sky-50 flex flex-col relative shadow-2xl transition-colors duration-500">
        
        <!-- 雲端同步 Loading 遮罩 -->
        <div id="loading" class="loading-overlay hidden">☁️ 雲端同步中...</div>

        <!-- 頂部標題列 -->
        <header id="header-theme" class="bg-sky-300/85 backdrop-blur-md px-4 py-3 text-center border-b border-white/60 flex items-center justify-between z-30 sticky top-0 transition-colors duration-500">
            <span id="header-tag" class="text-xs font-bold bg-white/85 px-2.5 py-1 rounded-full text-sky-600 shadow-sm">🌸 函館散策手帳</span>
            <div class="flex items-center space-x-1.5">
                <button onclick="fetchAllData()" class="text-xs bg-white/90 hover:bg-white px-2.5 py-1.5 rounded-full text-slate-600 shadow-sm transition-all cursor-pointer" title="重新整理同步">🔄</button>
                <button onclick="cycleTheme()" id="theme-btn" class="text-xs font-bold bg-white/95 hover:bg-white px-3 py-1.5 rounded-full text-slate-600 shadow-sm transition-all flex items-center space-x-1 cursor-pointer">
                    <span id="theme-icon">☁️</span>
                    <span id="theme-text">青空風格</span>
                </button>
            </div>
        </header>

        <!-- 內容主畫面區域 -->
        <div class="scroll-area p-4 flex flex-col">
            <div id="page-content" class="flex flex-col"></div>
        </div>

        <!-- 底部導航列 -->
        <nav id="nav-theme" class="fixed sm:absolute bottom-0 left-0 right-0 sm:max-w-md sm:mx-auto h-16 bg-white/95 backdrop-blur-md border-t border-sky-100 flex justify-around items-center px-2 z-40 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] shrink-0 transition-colors duration-500" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
            <div onclick="switchTab('traffic')" class="nav-item flex flex-col items-center justify-center cursor-pointer p-1 w-1/5 relative">
                <span class="text-base">🚆</span>
                <span class="nav-label text-[10px] font-bold mt-0.5">交通飯店</span>
                <div class="dot w-1 h-1 rounded-full mt-0.5 opacity-0 transition-all"></div>
            </div>
            <div onclick="switchTab('spots')" class="nav-item flex flex-col items-center justify-center cursor-pointer p-1 w-1/5 relative">
                <span class="text-base">🗺️</span>
                <span class="nav-label text-[10px] font-bold mt-0.5">景點</span>
                <div class="dot w-1 h-1 rounded-full mt-0.5 opacity-0 transition-all"></div>
            </div>
            <div onclick="switchTab('itinerary')" class="nav-item flex flex-col items-center justify-center cursor-pointer p-1 w-1/5 relative">
                <span class="text-base">📚</span>
                <span class="nav-label text-[10px] font-bold mt-0.5">行程</span>
                <div class="dot w-1 h-1 rounded-full mt-0.5 opacity-0 transition-all"></div>
            </div>
            <div onclick="switchTab('restaurant')" class="nav-item flex flex-col items-center justify-center cursor-pointer p-1 w-1/5 relative">
                <span class="text-base">🍽️</span>
                <span class="nav-label text-[10px] font-bold mt-0.5">美食</span>
                <div class="dot w-1 h-1 rounded-full mt-0.5 opacity-0 transition-all"></div>
            </div>
            <div onclick="switchTab('expense')" class="nav-item flex flex-col items-center justify-center cursor-pointer p-1 w-1/5 relative">
                <span class="text-base">💸</span>
                <span class="nav-label text-[10px] font-bold mt-0.5">記帳</span>
                <div class="dot w-1 h-1 rounded-full mt-0.5 opacity-0 transition-all"></div>
            </div>
        </nav>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwn7WUsn8U2j8yM8HfJqHkb5tMsMxxI1QMDV7kUM4uAoAWCJif4gQTgWuvTegoG0w5J/exec";

        let currentTab = 'itinerary';
        let currentDay = 1;
        let currentTheme = localStorage.getItem('hakodate_theme') || 'sky';
        
        let restaurants = [];
        let spots = [];
        let expenses = [];
        let hotelRoom = localStorage.getItem('hotelRoom') || '';

        function showLoading(show) {
            const loader = document.getElementById('loading');
            if(loader) {
                if(show) loader.classList.remove('hidden');
                else loader.classList.add('hidden');
            }
        }

        async function fetchAllData() {
            showLoading(true);
            try {
                let response = await fetch(`${API_URL}?action=getData`);
                let data = await response.json();
                spots = data.spots || [];
                restaurants = data.restaurants || [];
                expenses = data.expenses || [];
            } catch(e) {
                console.error("同步失敗", e);
            }
            showLoading(false);
            render();
        }

        async function cloudAdd(sheet, payload) {
            showLoading(true);
            try {
                let query = `?action=add&sheet=${sheet}&name=${encodeURIComponent(payload.name||'')}&url=${encodeURIComponent(payload.url||'')}&payer=${encodeURIComponent(payload.payer||'')}&amount=${payload.amount||''}&mayShare=${encodeURIComponent(payload.mayShare||'')}&pingShare=${encodeURIComponent(payload.pingShare||'')}`;
                await fetch(API_URL + query);
                await fetchAllData();
            } catch(e) {
                console.error("新增失敗", e);
                showLoading(false);
            }
        }

        async function cloudDelete(sheet, row) {
            showLoading(true);
            try {
                let query = `?action=delete&sheet=${sheet}&row=${row}`;
                await fetch(API_URL + query);
                await fetchAllData();
            } catch(e) {
                console.error("刪除失敗", e);
                showLoading(false);
            }
        }

        function cycleTheme() {
            if (currentTheme === 'sky') currentTheme = 'paper';
            else if (currentTheme === 'paper') currentTheme = 'night';
            else currentTheme = 'sky';
            localStorage.setItem('hakodate_theme', currentTheme);
            render();
        }

        function applyTheme() {
            const body = document.getElementById('body-theme');
            const container = document.getElementById('app-container');
            const header = document.getElementById('header-theme');
            const headerTag = document.getElementById('header-tag');
            const nav = document.getElementById('nav-theme');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (currentTheme === 'sky') {
                body.className = "bg-sky-100 text-slate-700 flex flex-col items-center min-h-screen transition-colors duration-500";
                container.className = "w-full sm:max-w-md min-h-screen sm:min-h-[92vh] sm:my-4 sm:rounded-3xl sm:border-4 sm:border-white bg-sky-50 flex flex-col relative shadow-2xl transition-colors duration-500";
                header.className = "bg-sky-300/85 backdrop-blur-md px-4 py-3 text-center border-b border-white/60 flex items-center justify-between z-30 sticky top-0 transition-colors duration-500";
                headerTag.className = "text-xs font-bold bg-white/85 px-2.5 py-1 rounded-full text-sky-600 shadow-sm";
                headerTag.innerText = "🌸 函館散策手帳";
                nav.className = "fixed sm:absolute bottom-0 left-0 right-0 sm:max-w-md sm:mx-auto h-16 bg-white/95 backdrop-blur-md border-t border-sky-100 flex justify-around items-center px-2 z-40 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] shrink-0 transition-colors duration-500";
                themeIcon.innerText = "☁️"; themeText.innerText = "青空風格";
            } else if (currentTheme === 'paper') {
                body.className = "bg-amber-100/70 text-amber-950 flex flex-col items-center min-h-screen transition-colors duration-500";
                container.className = "w-full sm:max-w-md min-h-screen sm:min-h-[92vh] sm:my-4 sm:rounded-3xl sm:border-4 sm:border-amber-200 bg-[#fbfbde] flex flex-col relative shadow-2xl transition-colors duration-500";
                header.className = "bg-amber-200/90 backdrop-blur-md px-4 py-3 text-center border-b border-amber-300/60 flex items-center justify-between z-30 sticky top-0 transition-colors duration-500";
                headerTag.className = "text-xs font-bold bg-amber-100 px-2.5 py-1 rounded-full text-amber-800 shadow-sm";
                headerTag.innerText = "📜 復古筆記手帳";
                nav.className = "fixed sm:absolute bottom-0 left-0 right-0 sm:max-w-md sm:mx-auto h-16 bg-[#fefce8]/95 backdrop-blur-md border-t border-amber-200 flex justify-around items-center px-2 z-40 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] shrink-0 transition-colors duration-500";
                themeIcon.innerText = "📜"; themeText.innerText = "紙質筆記";
            } else if (currentTheme === 'night') {
                body.className = "bg-slate-950 text-slate-100 flex flex-col items-center min-h-screen transition-colors duration-500";
                container.className = "w-full sm:max-w-md min-h-screen sm:min-h-[92vh] sm:my-4 sm:rounded-3xl sm:border-4 sm:border-slate-700 bg-slate-900 flex flex-col relative shadow-2xl transition-colors duration-500";
                header.className = "bg-indigo-950/90 backdrop-blur-md px-4 py-3 text-center border-b border-indigo-900/60 flex items-center justify-between z-30 sticky top-0 transition-colors duration-500";
                headerTag.className = "text-xs font-bold bg-indigo-900/80 px-2.5 py-1 rounded-full text-indigo-200 shadow-sm";
                headerTag.innerText = "🌌 函館山百萬夜景";
                nav.className = "fixed sm:absolute bottom-0 left-0 right-0 sm:max-w-md sm:mx-auto h-16 bg-slate-900/95 backdrop-blur-md border-t border-indigo-900 flex justify-around items-center px-2 z-40 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] shrink-0 transition-colors duration-500";
                themeIcon.innerText = "🌌"; themeText.innerText = "夜景觀星";
            }
            nav.style.paddingBottom = "env(safe-area-inset-bottom, 0px)";
        }

        function switchTab(tab) { currentTab = tab; render(); window.scrollTo(0, 0); }
        function switchDay(day) { currentDay = day; render(); }
        function saveRoom(val) { hotelRoom = val; localStorage.setItem('hotelRoom', val); }

        // 切換自訂分帳區塊
        function toggleCustomSplit() {
            const isCustom = document.getElementById('customSplitToggle').checked;
            const customFields = document.getElementById('customSplitFields');
            if (isCustom) {
                customFields.classList.remove('hidden');
                autoFillHalf();
            } else {
                customFields.classList.add('hidden');
                document.getElementById('exp-may-share').value = '';
                document.getElementById('exp-ping-share').value = '';
            }
        }

        function handleAmountInput() {
            const isCustom = document.getElementById('customSplitToggle')?.checked;
            if (isCustom) {
                autoFillHalf();
            }
        }

        function autoFillHalf() {
            const totalAmount = parseFloat(document.getElementById('exp-amount').value) || 0;
            const half = Math.round(totalAmount / 2);
            document.getElementById('exp-may-share').value = half;
            document.getElementById('exp-ping-share').value = half;
        }

        function render() {
            applyTheme();
            const content = document.getElementById('page-content');
            
            let cBg = currentTheme === 'night' ? 'bg-slate-800/90 border-slate-700 text-slate-100' : (currentTheme === 'paper' ? 'bg-amber-50/90 border-amber-200 text-amber-950' : 'bg-white/80 border-sky-100 text-slate-700');
            let cSubBg = currentTheme === 'night' ? 'bg-slate-900/80 border-slate-700 text-slate-200' : (currentTheme === 'paper' ? 'bg-amber-100/60 border-amber-200 text-amber-900' : 'bg-sky-50/70 border-sky-100 text-slate-600');
            let cPrimaryBtn = currentTheme === 'night' ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : (currentTheme === 'paper' ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-sky-400 hover:bg-sky-500 text-white');
            let cTextAccent = currentTheme === 'night' ? 'text-indigo-300' : (currentTheme === 'paper' ? 'text-amber-800' : 'text-sky-700');
            let dotColor = currentTheme === 'night' ? 'bg-indigo-400' : (currentTheme === 'paper' ? 'bg-amber-700' : 'bg-sky-500');

            const tabs = ['traffic', 'spots', 'itinerary', 'restaurant', 'expense'];
            tabs.forEach((t, idx) => {
                const navItem = document.querySelectorAll('.nav-item')[idx];
                const navLabel = navItem.querySelector('.nav-label');
                const dot = navItem.querySelector('.dot');
                
                navLabel.className = `nav-label text-[10px] font-bold mt-0.5 ${currentTheme === 'night' ? 'text-slate-400' : (currentTheme === 'paper' ? 'text-amber-900/70' : 'text-slate-500')}`;

                if (t === currentTab) {
                    navLabel.classList.add(currentTheme === 'night' ? 'text-indigo-300' : (currentTheme === 'paper' ? 'text-amber-900' : 'text-sky-600'));
                    dot.className = `dot w-1 h-1 rounded-full mt-0.5 opacity-100 ${dotColor}`;
                } else {
                    dot.className = `dot w-1 h-1 rounded-full mt-0.5 opacity-0`;
                }
            });

            if (currentTab === 'itinerary') {
                let dayBtnActive = currentTheme === 'night' ? 'bg-indigo-600 text-white shadow-md scale-105' : (currentTheme === 'paper' ? 'bg-amber-700 text-white shadow-md scale-105' : 'bg-sky-500 text-white shadow-md scale-105');
                let dayBtnNormal = currentTheme === 'night' ? 'bg-slate-800 text-slate-300 border border-slate-700' : (currentTheme === 'paper' ? 'bg-amber-50 text-amber-900 border border-amber-200' : 'bg-white text-slate-600 border border-sky-200');

                content.innerHTML = `
                    <div class="text-center mb-3 shrink-0">
                        <h2 class="text-lg font-bold ${cTextAccent}">✨ 函館悠閒三日遊 ✨</h2>
                        <p class="text-[11px] ${currentTheme === 'night' ? 'text-slate-400' : (currentTheme === 'paper' ? 'text-amber-900/60' : 'text-slate-400')}">點擊下方按鈕切換每日精彩旅程</p>
                    </div>
                    <div class="flex justify-center space-x-2 mb-4 shrink-0">
                        <button onclick="switchDay(1)" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${currentDay === 1 ? dayBtnActive : dayBtnNormal}">Day 1 🌟</button>
                        <button onclick="switchDay(2)" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${currentDay === 2 ? dayBtnActive : dayBtnNormal}">Day 2 🏮</button>
                        <button onclick="switchDay(3)" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${currentDay === 3 ? dayBtnActive : dayBtnNormal}">Day 3 🍦</button>
                    </div>
                    <div class="${cBg} backdrop-blur-md p-4 rounded-3xl shadow-sm border space-y-3 text-xs leading-relaxed">
                        ${currentDay === 1 ? `
                            <div class="flex items-center space-x-2 font-bold text-sm ${cTextAccent} pb-2 border-b">
                                <span class="${cSubBg} p-1.5 rounded-xl border">🚄</span>
                                <span>Day 1：抵達函館 ＆ 五稜郭與百萬夜景</span>
                            </div>
                            <div class="space-y-3 pl-1">
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 08:18 – 12:15 ｜ 新幹線移動</p>
                                    <p class="mt-1">➔ 搭乘 <strong>はやぶさ 5号</strong> (4號車 16AB) 從東京直奔新函館北斗，轉乘 JR Hakodate Liner。</p>
                                </div>
                                <div class="flex justify-center opacity-70">⬇️ 搭市電到五稜郭公園前站</div>
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 13:00 – 16:30 ｜ 飯店寄放行李 & 五稜郭漫步</p>
                                    <p class="mt-1">➔ 輕裝前往飯店登記入住/寄行李。<br>➔ 登 <strong>五稜郭塔</strong> 俯瞰星形雪花城郭與奉行所散策。</p>
                                </div>
                                <div class="flex justify-center opacity-70">⬇️ 市電至十字街站</div>
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 17:00 – 21:00 ｜ 世界級函館山夜景 & 晚餐</p>
                                    <p class="mt-1">➔ 提早 30 分鐘搭纜車上山卡位賞百萬夜景。
                                </div>
                            </div>
                        ` : ''}
                        ${currentDay === 2 ? `
                            <div class="flex items-center space-x-2 font-bold text-sm ${cTextAccent} pb-2 border-b">
                                <span class="${cSubBg} p-1.5 rounded-xl border">🏮</span>
                                <span>Day 2：港町風情、古蹟散策與沿海體驗</span>
                            </div>
                            <div class="space-y-3 pl-1">
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 07:00 – 9:00 ｜ 函館朝市吃海鮮</p>
                                    <p class="mt-1">➔ 搭市電至函館站前，品嚐海鮮！</p>
                                </div>
                                <div class="flex justify-center opacity-70">⬇️ 步行/市電至末廣町</div>
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 9:30 – 14:30 ｜ 元町異國街區 & 金森紅磚倉庫</p>
                                    <p class="mt-1">➔ 漫步斜坡 <strong>八幡坂</strong>、參訪浪漫教會群。<br>➔ 走到海邊紅磚倉庫，品嚐 <strong>Snaffle’s</strong> 現做起司蛋糕與下午茶。</p>
                                </div>
                                <div class="flex justify-center opacity-70">⬇️ 市電至湯之川</div>
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 15:00 – 20:00 ｜ 湯之川溫泉區與晚餐</p>
                                    <p class="mt-1">➔ 造訪熱帶植物園看可愛猴子泡溫泉、足湯放鬆。<br>➔ 晚餐在湯川溫泉區周遭。</p>
                                </div>
                            </div>
                        ` : ''}
                        ${currentDay === 3 ? `
                            <div class="flex items-center space-x-2 font-bold text-sm ${cTextAccent} pb-2 border-b">
                                <span class="${cSubBg} p-1.5 rounded-xl border">🍦</span>
                                <span>Day 3：女子修道院巡禮 ＆ 歡樂賦歸</span>
                            </div>
                            <div class="space-y-3 pl-1">
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 09:00 – 11:30 ｜ 天使の聖母トラピスチヌ修道院</p>
                                    <p class="mt-1">➔ 寄放行李後搭公車前往修道院，欣賞歐風庭園建築，吃「市民の森」霜淇淋！</p>
                                </div>
                                <div class="flex justify-center opacity-70">⬇️ 返回 JR 函館站</div>
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 12:00 – 16:00 ｜ 最後採買與站前美食</p>
                                    <p class="mt-1">➔ 享用遺珠美食（拉麵/海鮮），在 Ekini 市場買齊墨魚點心等伴手禮。</p>
                                </div>
                                <div class="flex justify-center opacity-70">⬇️ 新幹線返回東京</div>
                                <div class="${cSubBg} p-2.5 rounded-2xl border">
                                    <p class="font-bold ${cTextAccent}">⏰ 17:26 – 21:23 ｜ 回程</p>
                                    <p class="mt-1">➔ 搭乘 <strong>はやぶさ 40号</strong> 舒適返回東京車站。</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
                      } else if (currentTab === 'traffic') {
                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-3 text-center shrink-0 ${cTextAccent}">🚆 交通與住宿完整指南</h2>
                    <div class="space-y-3 text-xs mb-20">
                        
                        <!-- 飯店基本資訊與靜態房號欄位（直接在下方雙引號內填入房號） -->
                        <div class="${cBg} backdrop-blur-md p-3.5 rounded-2xl shadow-sm border space-y-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-lg">🏨</span>
                                <div>
                                    <p class="font-bold text-sm ${cTextAccent}">ホテルマイステイズ函館五稜郭</p>
                                    <p class="text-[10px] opacity-70">MyStays Hakodate Goryokaku</p>
                                </div>
                            </div>
                            <div class="w-full h-20 bg-gradient-to-r ${currentTheme==='night'?'from-slate-900 to-indigo-950 text-indigo-200':(currentTheme==='paper'?'from-amber-200 to-amber-300 text-amber-900':'from-sky-200 to-indigo-100 text-sky-800')} rounded-xl flex flex-col items-center justify-center text-xs shadow-inner">
                                <span class="text-xl mb-0.5">🏢</span>
                                <span class="font-bold text-[11px]">簡潔舒適的現代商旅・鄰近五稜郭公園</span>
                            </div>
                            <div class="text-[11px] space-y-1.5 pt-1 border-t">
                                <p>📍 <strong>地址：</strong>北海道函館市本町26-17 <a href="https://maps.google.com/?q=北海道函館市本町26-17" target="_blank" class="${cTextAccent} underline font-bold">[地圖]</a></p>
                                <p>🚇 <strong>交通：</strong>JR函館站搭市電 15 分鐘至「五稜郭公園前」站，下車步行 1 分鐘</p>
                                <!-- 房號靜態顯示區（抵達後直接來 GitHub 修改這裡的數字即可） -->
                                <p class="pt-1.5 border-t font-bold ${cTextAccent}">🔑 房號： 尚未填寫 室</p>
                            </div>
                        </div>

                        <!-- 當地市電與重要交通導覽 -->
                        <div class="${cBg} backdrop-blur-md p-3.5 rounded-2xl shadow-sm border space-y-2.5">
                            <p class="font-bold text-xs ${cTextAccent} flex items-center"><span class="mr-1.5">🚊</span> 當地市電與重要交通導覽</p>
                            <div class="space-y-2 text-[11px]">
                                <div class="${cSubBg} p-2 rounded-xl border">
                                    <p class="font-bold ${cTextAccent} mb-0.5">🚋 函館市電（路面電車）</p>
                                    <p class="leading-relaxed">• <strong>運行班距：</strong>約 6 至 10 分鐘一班。<br>• 🎫 推薦購買 <a href="https://www.city.hakodate.hokkaido.jp/docs/2014012100977/" target="_blank" class="${cTextAccent} underline font-bold">函館市電一日乘車券</a>最划算！</p>
                                </div>
                                <div class="${cSubBg} p-2 rounded-xl border">
                                    <p class="font-bold ${cTextAccent} mb-0.5">🚌 五稜郭／市區前往修道院交通</p>
                                    <p class="leading-relaxed">
                                        • <strong>主要公車號：</strong>可搭乘函館巴士 <strong>66系統</strong>、<strong>12系統</strong> 或 <strong>99系統</strong>。<br>
                                        • <strong>搭乘站點：</strong>從「五稜郭公園入口」或「五稜郭」站上車，至<strong>🔊<span>「トラピスチヌ入口（修道院入口）」</span></strong>下車步行約 5-10 分鐘。<br>
                                        • ⚠️ <strong>注意：</strong>地方巴士班次間隔較長，建議出發前務必先查詢當下發車時刻！
                                    </p>
                                </div>
                                <div class="${cSubBg} p-2 rounded-xl border">
                                    <p class="font-bold ${cTextAccent} mb-0.5">🚠 函館山纜車</p>
                                    <p class="leading-relaxed">
                                        • <strong>運行班距：</strong>約每 10 至 15 分鐘一班（人潮多時會加密班次）。<br>
                                        • ⏰ <strong>營業時間：</strong>
                                          <br>　- 春夏季（約 4 月中旬～10月中下旬）：10:00～22:00（上行最終 21:50 / 下行最終 22:00）
                                          <br>　- 秋冬季節（約 10 月下旬～4月中旬）：10:00～21:00（上行最終 20:50 / 下行最終 21:00）
                                          <br>　• 💡 <strong>小貼士：</strong>單程約 3 分鐘。上山前記得先查看山上即時天候與能見度，避免起霧影響百萬夜景視野！
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- 新幹線指定席資訊 -->
                        <div class="${cBg} backdrop-blur-md p-3 rounded-2xl shadow-sm border space-y-1.5">
                            <p class="font-bold text-xs ${cTextAccent} flex items-center"><span class="mr-1.5">🚄</span> 新幹線指定席資訊</p>
                            <div class="grid grid-cols-2 gap-2 pt-1 text-[11px]">
                                <div class="${cSubBg} p-2 rounded-xl border">
                                    <p class="font-bold ${cTextAccent}">去程：はやぶさ 5号</p>
                                    <p class="mt-0.5">08:18 東京 ➔ 12:15 新函館北斗</p>
                                    <p class="${cTextAccent} font-bold mt-1">座位：4號車 16AB</p>
                                </div>
                                <div class="${cSubBg} p-2 rounded-xl border">
                                    <p class="font-bold ${cTextAccent}">回程：はやぶさ 40号</p>
                                    <p class="mt-0.5">17:26 新函館北斗 ➔ 21:23 東京</p>
                                    <p class="${cTextAccent} font-bold mt-1">座位：8號車 07DE</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                `;
            } else if (currentTab === 'spots') {
                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-3 text-center shrink-0 ${cTextAccent}">⭐ 景點清單</h2>
                    <div class="${cBg} backdrop-blur-md p-3 rounded-2xl shadow-sm mb-3 border space-y-2 shrink-0">
                        <input type="text" id="spot-name" placeholder="輸入景點名稱" class="w-full p-2.5 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                        <input type="text" id="spot-url" placeholder="貼上 Google Map 網址" class="w-full p-2.5 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                        <button onclick="handleSpotAdd()" class="w-full ${cPrimaryBtn} py-2 rounded-xl text-xs font-bold shadow-sm">✨ 新增至景點口袋</button>
                    </div>
                    <div class="space-y-3">
                        ${spots.map((item) => `
                            <div class="${cBg} backdrop-blur-md p-3 rounded-2xl shadow-sm flex items-center justify-between border">
                                <div class="flex items-center space-x-2.5 min-w-0 flex-1 mr-2">
                                    <div class="w-9 h-9 ${cSubBg} rounded-xl flex items-center justify-center text-sm shrink-0 border">📍</div>
                                    <p class="font-bold text-xs truncate">${item.col1}</p>
                                </div>
                                <div class="flex items-center space-x-1 shrink-0">
                                    ${item.col2 ? `<a href="${item.col2}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow-sm">地圖</a>` : ''}
                                    <button onclick="cloudDelete('spots', ${item.row})" class="text-red-400 hover:text-red-600 text-xs font-bold px-1.5 py-1">刪除</button>
                                </div>
                            </div>
                        `).join('') || `<div class="text-center text-xs mt-12 ${cBg} p-6 rounded-3xl border border-dashed">✨ 快加入你想去的私房景點與地圖吧！</div>`}
                    </div>
                `;
            } else if (currentTab === 'restaurant') {
                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-3 text-center shrink-0 ${cTextAccent}">🍣 美食清單 🍔</h2>
                    <div class="${cBg} backdrop-blur-md p-3 rounded-2xl shadow-sm mb-3 border space-y-2 shrink-0">
                        <input type="text" id="resto-name" placeholder="輸入店家名稱" class="w-full p-2.5 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                        <input type="text" id="resto-url" placeholder="貼上 Google Map 網址" class="w-full p-2.5 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                        <button onclick="handleRestoAdd()" class="w-full ${cPrimaryBtn} py-2 rounded-xl text-xs font-bold shadow-sm">✨ 新增至美食口袋</button>
                    </div>
                    <div class="space-y-3">
                        ${restaurants.map((item) => `
                            <div class="${cBg} backdrop-blur-md p-3 rounded-2xl shadow-sm flex items-center justify-between border">
                                <div class="flex items-center space-x-2.5 min-w-0 flex-1 mr-2">
                                    <div class="w-9 h-9 ${cSubBg} rounded-xl flex items-center justify-center text-sm shrink-0 border">🍴</div>
                                    <p class="font-bold text-xs truncate">${item.col1}</p>
                                </div>
                                <div class="flex items-center space-x-1 shrink-0">
                                    ${item.col2 ? `<a href="${item.col2}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow-sm">地圖</a>` : ''}
                                    <button onclick="cloudDelete('restaurants', ${item.row})" class="text-red-400 hover:text-red-600 text-xs font-bold px-1.5 py-1">刪除</button>
                                </div>
                            </div>
                        `).join('') || `<div class="text-center text-xs mt-12 ${cBg} p-6 rounded-3xl border border-dashed">🍣 快把想吃的拉麵、壽司與地圖加進來吧！</div>`}
                    </div>
                `;
            } else if (currentTab === 'expense') {
                let mayPaid = 0, pingPaid = 0;
                let mayShouldPay = 0, pingShouldPay = 0;

                expenses.forEach(e => {
                    let amt = parseFloat(e.amount) || 0;
                    let payer = e.payer;
                    
                    // 計算墊付金額
                    if (payer === 'May') mayPaid += amt;
                    if (payer === '萍') pingPaid += amt;

                    // 🌸 讀取後端回傳的新欄位（mayShare / pingShare），若沒填則預設對半分
                    let mayShare = (e.mayShare !== undefined && e.mayShare !== '') ? parseFloat(e.mayShare) : (amt / 2);
                    let pingShare = (e.pingShare !== undefined && e.pingShare !== '') ? parseFloat(e.pingShare) : (amt / 2);

                    mayShouldPay += mayShare;
                    pingShouldPay += pingShare;
                });

                let mayNet = mayPaid - mayShouldPay;
                let pingNet = pingPaid - pingShouldPay;
                
                let settlementText = "✨ 兩人目前花費已完全打平！";
                if (mayNet < 0) {
                    settlementText = `💡 May 要給 萍 ￥${Math.abs(Math.round(mayNet))} (結算差額)`;
                } else if (pingNet < 0) {
                    settlementText = `💡 萍 要給 May ￥${Math.abs(Math.round(pingNet))} (結算差額)`;
                }

                content.innerHTML = `
                    <h2 class="text-lg font-bold mb-2 text-center shrink-0 ${cTextAccent}">💰 記帳本</h2>
                    <div class="${cBg} backdrop-blur-md p-3 rounded-2xl shadow-sm mb-3 border space-y-2 shrink-0">
                        <div class="flex space-x-2">
                            <select id="exp-payer" class="p-2 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                                <option value="May">May 墊付</option>
                                <option value="萍">萍 墊付</option>
                            </select>
                            <input type="text" id="exp-name" placeholder="消費品項/店名" class="flex-1 p-2 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                        </div>
                        <input type="number" id="exp-amount" placeholder="總金額 (JPY 圓)" class="w-full p-2 border rounded-xl text-xs ${cSubBg} focus:outline-none" oninput="handleAmountInput()">

                        <!-- 💡 自訂分帳開關 -->
                        <div class="flex items-center space-x-2 pt-1">
                            <input type="checkbox" id="customSplitToggle" onchange="toggleCustomSplit()" class="rounded border-gray-300">
                            <label for="customSplitToggle" class="text-xs text-gray-600 cursor-pointer">自訂兩人分攤金額（不勾選則預設平分）</label>
                        </div>

                        <!-- 💡 自訂金額輸入區（預設隱藏） -->
                        <div id="customSplitFields" class="hidden grid grid-cols-2 gap-2 pt-1">
                            <div>
                                <label class="text-[10px] text-gray-500">May 應付</label>
                                <input type="number" id="exp-may-share" placeholder="May 金額" class="w-full p-2 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-500">萍 應付</label>
                                <input type="number" id="exp-ping-share" placeholder="萍 金額" class="w-full p-2 border rounded-xl text-xs ${cSubBg} focus:outline-none">
                            </div>
                        </div>

                        <button onclick="handleExpAdd()" class="w-full ${cPrimaryBtn} py-2 rounded-xl text-xs font-bold shadow-sm">我付了錢💸</button>
                    </div>
                    <div class="space-y-2.5 mb-2">
                                              <div class="${cBg} p-2.5 rounded-2xl border">
                            <h3 class="text-xs font-bold ${cTextAccent} mb-1 flex justify-between"><span>🌸 May 墊付總計</span><span>￥${mayPaid}</span></h3>
                            <div class="space-y-1.5 text-xs">
                                ${expenses.filter(e => e.payer === 'May').map((e) => {
                                    let mShare = (e.mayShare !== undefined && e.mayShare !== '') ? e.mayShare : (e.amount / 2);
                                    let pShare = (e.pingShare !== undefined && e.pingShare !== '') ? e.pingShare : (e.amount / 2);
                                    return `
                                        <div class="${cSubBg} px-2.5 py-1.5 rounded-xl border space-y-0.5">
                                            <div class="flex justify-between font-bold">
                                                <span>${e.name}</span>
                                                <span>￥${e.amount} <button onclick="cloudDelete('expenses', ${e.row})" class="text-red-400 ml-1.5 font-bold">×</button></span>
                                            </div>
                                            <div class="text-[10px] opacity-75 flex justify-between">
                                                <span>分攤：May ￥${mShare} / 萍 ￥${pShare}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('') || '<span class="text-xs opacity-60">尚無紀錄</span>'}
                            </div>
                        </div>
                        <div class="${cBg} p-2.5 rounded-2xl border">
                            <h3 class="text-xs font-bold ${cTextAccent} mb-1 flex justify-between"><span>🌸 萍 墊付總計</span><span>￥${pingPaid}</span></h3>
                            <div class="space-y-1.5 text-xs">
                                ${expenses.filter(e => e.payer === '萍').map((e) => {
                                    let mShare = (e.mayShare !== undefined && e.mayShare !== '') ? e.mayShare : (e.amount / 2);
                                    let pShare = (e.pingShare !== undefined && e.pingShare !== '') ? e.pingShare : (e.amount / 2);
                                    return `
                                        <div class="${cSubBg} px-2.5 py-1.5 rounded-xl border space-y-0.5">
                                            <div class="flex justify-between font-bold">
                                                <span>${e.name}</span>
                                                <span>￥${e.amount} <button onclick="cloudDelete('expenses', ${e.row})" class="text-red-400 ml-1.5 font-bold">×</button></span>
                                            </div>
                                            <div class="text-[10px] opacity-75 flex justify-between">
                                                <span>分攤：May ￥${mShare} / 萍 ￥${pShare}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('') || '<span class="text-xs opacity-60">尚無紀錄</span>'}
                            </div>
                        </div>
                    </div>
                    <div class="${cBg} backdrop-blur-md p-2.5 rounded-2xl shadow-sm text-center font-bold ${cTextAccent} border text-xs shrink-0">
                        ${settlementText}
                    </div>
                `;
            }
        }

        function handleSpotAdd() {
            const name = document.getElementById('spot-name').value;
            const url = document.getElementById('spot-url').value;
            if (!name) return alert('請輸入景點名稱');
            cloudAdd('spots', { name, url });
        }

        function handleRestoAdd() {
            const name = document.getElementById('resto-name').value;
            const url = document.getElementById('resto-url').value;
            if (!name) return alert('請輸入店家名稱');
            cloudAdd('restaurants', { name, url });
        }

        function handleExpAdd() {
            const payer = document.getElementById('exp-payer').value;
            const name = document.getElementById('exp-name').value;
            const amount = document.getElementById('exp-amount').value;
            
            const isCustom = document.getElementById('customSplitToggle')?.checked;
            let mayShare = '';
            let pingShare = '';
            
            if (isCustom) {
                mayShare = document.getElementById('exp-may-share').value;
                pingShare = document.getElementById('exp-ping-share').value;
            }

            if (!name || !amount) return alert('請完整填寫項目與金額');
            cloudAdd('expenses', { payer, name, amount, mayShare, pingShare });
        }

        fetchAllData();
    </script>
</body>
</html>
