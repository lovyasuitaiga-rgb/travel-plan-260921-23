<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的函館旅行小幫手</title>
    <!-- 引入 Google Fonts 手寫感可愛字體 (Zen Maru Gothic / 圓體) -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
        }
    </style>
</head>
<body class="bg-sky-200 text-slate-700 flex justify-center items-center min-h-screen m-0 select-none">

    <!-- 手機外框容器 (固定手機比例 RWD) -->
    <div id="app-container" class="w-full max-w-md h-[850px] bg-sky-200 flex flex-col justify-between relative shadow-2xl overflow-hidden rounded-3xl border-4 border-white/80">
        
        <!-- 頂部色彩設定快速提示 -->
        <div class="absolute top-2 right-2 z-50 text-[10px] bg-white/50 p-1 rounded backdrop-blur">
            <span class="cursor-pointer" onclick="alert('可以直接修改程式碼中的 class 來調整外觀！')">🎨 手寫風主題</span>
        </div>

        <!-- 內容主畫面區域 (根據當前分頁切換) -->
        <main class="flex-1 overflow-y-auto p-4 pb-24 flex flex-col">
            <div id="page-content" class="flex-1 flex flex-col">
                <!-- 動態載入頁面內容 -->
            </div>
        </main>

        <!-- 底部五項功能導航列 (行程 / 景點 / 交通 / 餐廳 / 記帳) -->
        <nav class="absolute bottom-0 left-0 right-0 h-20 bg-white/80 backdrop-blur-md border-t border-white/50 flex justify-around items-center px-2 z-40 shadow-lg">
            <!-- 1. 行程 (首頁) -->
            <div onclick="switchTab('itinerary')" class="nav-item flex flex-col items-center cursor-pointer relative group">
                <div class="icon-bg w-12 h-12 flex items-center justify-center text-2xl transition-all">🚆</div>
                <div class="indicator w-2 h-2 rounded-full bg-sky-400 mt-1 opacity-0 transition-all"></div>
            </div>
            <!-- 2. 景點 -->
            <div onclick="switchTab('spots')" class="nav-item flex flex-col items-center cursor-pointer relative group">
                <div class="icon-bg w-12 h-12 flex items-center justify-center text-2xl transition-all">⭐</div>
                <div class="indicator w-2 h-2 rounded-full bg-sky-400 mt-1 opacity-0 transition-all"></div>
            </div>
            <!-- 3. 交通與飯店 (已與行程交換位置) -->
            <div onclick="switchTab('traffic')" class="nav-item flex flex-col items-center cursor-pointer relative group">
                <div class="icon-bg w-12 h-12 flex items-center justify-center text-2xl transition-all">📚</div>
                <div class="indicator w-2 h-2 rounded-full bg-sky-400 mt-1 opacity-0 transition-all"></div>
            </div>
            <!-- 4. 餐廳 -->
            <div onclick="switchTab('restaurant')" class="nav-item flex flex-col items-center cursor-pointer relative group">
                <div class="icon-bg w-12 h-12 flex items-center justify-center text-2xl transition-all">🍽️</div>
                <div class="indicator w-2 h-2 rounded-full bg-sky-400 mt-1 opacity-0 transition-all"></div>
            </div>
            <!-- 5. 記帳 -->
            <div onclick="switchTab('expense')" class="nav-item flex flex-col items-center cursor-pointer relative group">
                <div class="icon-bg w-12 h-12 flex items-center justify-center text-2xl transition-all">💵</div>
                <div class="indicator w-2 h-2 rounded-full bg-sky-400 mt-1 opacity-0 transition-all"></div>
            </div>
        </nav>
    </div>

    <script>
        // 目前所在分頁 (預設為行程)
        let currentTab = 'itinerary';
        let currentDay = 1; // 行程預設 Day 1

        // 資料狀態 (LocalStorage 暫存)
        let restaurants = JSON.parse(localStorage.getItem('restaurants')) || [];
        let spots = JSON.parse(localStorage.getItem('spots')) || [];
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        let hotelRoom = localStorage.getItem('hotelRoom') || '';

        function switchTab(tab) {
            currentTab = tab;
            render();
        }

        function switchDay(day) {
            currentDay = day;
            render();
        }

        function saveRoom(val) {
            hotelRoom = val;
            localStorage.setItem('hotelRoom', val);
        }

        // 畫面渲染總控
        function render() {
            const content = document.getElementById('page-content');
            
            // 更新底部導航列與藍色圓點指示燈
            const tabs = ['itinerary', 'spots', 'traffic', 'restaurant', 'expense'];
            tabs.forEach((t, idx) => {
                const navItem = document.querySelectorAll('.nav-item')[idx];
                const indicator = navItem.querySelector('.indicator');
                const iconBg = navItem.querySelector('.icon-bg');
                
                if (t === currentTab) {
                    indicator.style.opacity = '1';
                    iconBg.classList.add('bg-sky-300/40', 'rounded-full');
                } else {
                    indicator.style.opacity = '0';
                    iconBg.classList.remove('bg-sky-300/40', 'rounded-full');
                }
            });

            // 1. 行程頁面 (首頁)
            if (currentTab === 'itinerary') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center">📅 函館三日旅行程</h2>
                    <!-- Day 切換按鈕 -->
                    <div class="flex justify-center space-x-2 mb-4">
                        <button onclick="switchDay(1)" class="px-4 py-1.5 rounded-full text-xs font-bold ${currentDay === 1 ? 'bg-sky-500 text-white shadow' : 'bg-white/70 text-slate-600'}">Day 1</button>
                        <button onclick="switchDay(2)" class="px-4 py-1.5 rounded-full text-xs font-bold ${currentDay === 2 ? 'bg-sky-500 text-white shadow' : 'bg-white/70 text-slate-600'}">Day 2</button>
                        <button onclick="switchDay(3)" class="px-4 py-1.5 rounded-full text-xs font-bold ${currentDay === 3 ? 'bg-sky-500 text-white shadow' : 'bg-white/70 text-slate-600'}">Day 3</button>
                    </div>

                    <div class="bg-white/70 backdrop-blur-md p-4 rounded-2xl shadow-sm flex-1 overflow-y-auto border border-white/60 space-y-3 text-xs leading-relaxed">
                        ${currentDay === 1 ? `
                            <div class="font-bold text-sm text-sky-600 pb-1 border-b border-sky-100">Day 1：抵達函館 ＆ 五稜郭周邊與函館山夜景</div>
                            <div class="space-y-2">
                                <p><strong>08:00–12:30｜新幹線移動</strong><br>• 東京搭 Hayabusa 5号 至新函館北斗，轉乘 JR Hakodate Liner 至五稜郭或函館。</p>
                                <p><strong>13:00–13:30｜飯店寄放行李</strong><br>• 抵達 ホテルマイステイズ函館五稜郭 寄放行李。</p>
                                <p><strong>13:30–16:30｜五稜郭公園與五稜郭塔</strong><br>• 午餐：幸運小丑漢堡（五稜郭公園前店）或味彩本店鹽味拉麵。<br>• 景點：登五稜郭塔俯瞰星形城郭、散步奉行所。</p>
                                <p><strong>17:00–19:30｜世界級夜景：函館山</strong><br>• 搭市電至十字街站，轉乘纜車上山賞百萬夜景（建議日落前 30-45 分鐘卡位）。</p>
                                <p><strong>20:00–｜晚餐與返回飯店</strong><br>• 返回五稜郭本町周邊享用居酒屋或成吉思汗烤肉，回飯店泡湯休息。</p>
                            </div>
                        ` : ''}

                        ${currentDay === 2 ? `
                            <div class="font-bold text-sm text-sky-600 pb-1 border-b border-sky-100">Day 2：港町風情、古蹟散策與沿海體驗</div>
                            <div class="space-y-2">
                                <p><strong>08:00–10:00｜函館朝市體驗</strong><br>• 搭市電至函館站前，品嚐海鮮丼、體驗釣活烏賊、烤帝王蟹腳。</p>
                                <p><strong>10:30–13:00｜元町異國風情街區散策</strong><br>• 走訪八幡坂、舊函館區公會堂、東正教堂、天主堂。</p>
                                <p><strong>13:00–15:30｜金森紅磚倉庫商圈</strong><br>• 倉庫區 Snaffle’s 品嚐現做乳酪蛋糕、挑選伴手禮。</p>
                                <p><strong>16:00–18:00｜湯之川溫泉區</strong><br>• 搭市電至湯之川，看猴子泡溫泉或足湯放鬆。</p>
                                <p><strong>18:30–｜晚餐</strong><br>• 金森倉庫附近海鮮俱樂部、阿佐利壽喜燒，或返回五稜郭。</p>
                            </div>
                        ` : ''}

                        ${currentDay === 3 ? `
                            <div class="font-bold text-sm text-sky-600 pb-1 border-b border-sky-100">Day 3：近郊建築巡禮 ＆ 站前採買回程</div>
                            <div class="space-y-2">
                                <p><strong>09:00–11:30｜特拉皮斯汀女子修道院</strong><br>• 退房寄放行李，搭公車前往女子修道院欣賞庭園造景與市民森霜淇淋。</p>
                                <p><strong>12:00–16:00｜函館站前最後採買與午餐</strong><br>• JR 函館站周邊享用遺珠美食、補齊伴手禮（墨魚點心、乳酪製品）。</p>
                                <p><strong>16:00–16:30｜前往新函館北斗站</strong><br>• 搭乘 JR Hakodate Liner 前往新函館北斗。</p>
                                <p><strong>17:26｜搭乘新幹線返回東京</strong><br>• 搭乘 Hayabusa 40号 (8號車 07DE) 於 21:23 返抵東京車站。</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            } 
            // 2. 景點頁面
            else if (currentTab === 'spots') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center">⭐ 景點口袋名單</h2>
                    <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm mb-4 border border-white/60 space-y-2">
                        <input type="text" id="spot-url" placeholder="輸入 Google Map 連結或景點名稱" class="w-full p-2 border rounded-xl text-sm bg-white/80 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        <button onclick="addSpot()" class="w-full bg-sky-400 hover:bg-sky-500 text-white py-2 rounded-xl text-sm font-bold shadow">新增景點</button>
                    </div>
                    <div class="space-y-3 overflow-y-auto flex-1">
                        ${spots.map((item, index) => `
                            <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm flex items-center space-x-3 border border-white/60">
                                <div class="w-16 h-16 bg-slate-200 rounded-xl flex items-center justify-center text-xs text-slate-500 shrink-0">📍 縮圖</div>
                                <div class="flex-1 min-w-0">
                                    <p class="font-bold text-sm truncate">${item.name}</p>
                                    <p class="text-xs text-slate-400 mt-1">簡易交通資訊：請參照上方行程建議</p>
                                </div>
                                <button onclick="deleteSpot(${index})" class="text-red-400 text-xs">刪除</button>
                            </div>
                        `).join('') || '<p class="text-center text-slate-400 text-xs mt-8">尚無景點，快來新增吧！</p>'}
                    </div>
                `;
            } 
            // 3. 交通與飯店頁面 (已移至第三個分頁)
            else if (currentTab === 'traffic') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center">📚 交通與飯店資訊</h2>
                    <div class="space-y-3 overflow-y-auto flex-1 text-xs">
                        <!-- 飯店卡片 (含房號填寫) -->
                        <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm border border-white/60 space-y-1">
                            <p class="font-bold text-sm text-sky-700">🏨 飯店：ホテルマイステイズ函館五稜郭</p>
                            <div class="flex items-center space-x-2 pt-1">
                                <span class="font-bold">房號：</span>
                                <input type="text" value="${hotelRoom}" oninput="saveRoom(this.value)" placeholder="直接點擊輸入房號" class="flex-1 p-1.5 border rounded-lg bg-white/90 text-xs focus:outline-none">
                            </div>
                        </div>

                        <!-- 去程新幹線 -->
                        <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm border border-white/60 space-y-1">
                            <p class="font-bold text-sm text-sky-700">🚄 去程新幹線</p>
                            <p>• 班次：<strong>はやぶさ 5号</strong></p>
                            <p>• 時間：<strong>08:00–12:30</strong> (東京站 ➔ 新函館北斗)</p>
                            <p>• 座位：<strong>4號車 16AB</strong></p>
                        </div>

                        <!-- 回程新幹線 -->
                        <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm border border-white/60 space-y-1">
                            <p class="font-bold text-sm text-sky-700">🚄 回程新幹線</p>
                            <p>• 班次：<strong>はやぶさ 40号</strong></p>
                            <p>• 時間：<strong>17:26–21:23</strong> (新函館北斗 ➔ 東京站)</p>
                            <p>• 座位：<strong>8號車 07DE</strong></p>
                        </div>

                        <!-- 當地交通時刻與工具 -->
                        <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm border border-white/60 space-y-2">
                            <p class="font-bold text-sm text-sky-700">🚇 當地交通時刻與連結</p>
                            <div class="space-y-1 pl-2">
                                <p>• 🚊 函館市電時刻表：請利用 Google Maps 或查詢市電官網</p>
                                <p>• 🚌 函館巴士（湯川往聖母院路線）：班次較少，建議出發前再次確認站牌</p>
                                <p>• 🎫 <a href="https://www.city.hakodate.hokkaido.jp/kotsu/senjo/otoku_josha.htm" target="_blank" class="text-sky-600 underline font-bold">函館市電一日券官方說明與購票網址</a></p>
                            </div>
                        </div>
                    </div>
                `;
            } 
            // 4. 餐廳頁面
            else if (currentTab === 'restaurant') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center">🍽️ 餐廳口袋名單</h2>
                    <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm mb-4 border border-white/60 space-y-2">
                        <input type="text" id="resto-url" placeholder="google map url" class="w-full p-2 border rounded-xl text-sm bg-white/80 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        <button onclick="addRestaurant()" class="w-full bg-sky-400 hover:bg-sky-500 text-white py-2 rounded-xl text-sm font-bold shadow">追加</button>
                    </div>
                    <div class="space-y-3 overflow-y-auto flex-1">
                        ${restaurants.map((item, index) => `
                            <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm flex justify-between items-center border border-white/60">
                                <span class="text-sm font-bold truncate">店家：${item.name}</span>
                                <div class="space-x-2">
                                    <a href="${item.url}" target="_blank" class="text-xs bg-emerald-500 text-white px-2 py-1 rounded-lg">地圖</a>
                                    <button onclick="deleteRestaurant(${index})" class="text-red-400 text-xs">刪除</button>
                                </div>
                            </div>
                        `).join('') || '<p class="text-center text-slate-400 text-xs mt-8">尚無餐廳紀錄</p>'}
                    </div>
                `;
            } 
            // 5. 記帳頁面
            else if (currentTab === 'expense') {
                let mayTotal = 0;
                let pingTotal = 0;

                expenses.forEach(e => {
                    if (e.payer === 'May') mayTotal += Number(e.amount);
                    if (e.payer === '萍') pingTotal += Number(e.amount);
                });

                const totalExpense = mayTotal + pingTotal;
                let settlementText = "兩人花費已打平，無需互補";
                let diff = Math.abs(mayTotal - pingTotal) / 2;
                
                if (mayTotal > pingTotal) {
                    settlementText = `萍 要給 May ￥${diff} (一人份差額)`;
                } else if (pingTotal > mayTotal) {
                    settlementText = `May 要給 萍 ￥${diff} (一人份差額)`;
                }

                content.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center">💵 雙人記帳本</h2>
                    <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl shadow-sm mb-4 border border-white/60 space-y-2">
                        <div class="flex space-x-2">
                            <select id="exp-payer" class="p-2 border rounded-xl text-sm bg-white/80 focus:outline-none">
                                <option value="May">May 墊</option>
                                <option value="萍">萍 墊</option>
                            </select>
                            <input type="text" id="exp-name" placeholder="品項/店名" class="flex-1 p-2 border rounded-xl text-sm bg-white/80 focus:outline-none">
                        </div>
                        <input type="number" id="exp-amount" placeholder="費用 (JPY)" class="w-full p-2 border rounded-xl text-sm bg-white/80 focus:outline-none">
                        <button onclick="addExpense()" class="w-full bg-sky-400 hover:bg-sky-500 text-white py-2 rounded-xl text-sm font-bold shadow">追加記帳</button>
                    </div>

                    <!-- May 墊的費用清單 -->
                    <div class="mb-3">
                        <h3 class="text-xs font-bold text-sky-600 mb-1">May 墊的費用 (總計: ￥${mayTotal})</h3>
                        <div class="bg-white/70 backdrop-blur-md p-2 rounded-xl text-xs space-y-1 border border-white/60">
                            ${expenses.filter(e => e.payer === 'May').map((e) => `
                                <div class="flex justify-between"><span>${e.name}</span><span>￥${e.amount} <button onclick="deleteExpense(${expenses.indexOf(e)})" class="text-red-400 ml-1">x</button></span></div>
                            `).join('') || '<span class="text-slate-400">無紀錄</span>'}
                        </div>
                    </div>

                    <!-- 萍 墊的費用清單 -->
                    <div class="mb-3">
                        <h3 class="text-xs font-bold text-sky-600 mb-1">萍 墊的費用 (總計: ￥${pingTotal})</h3>
                        <div class="bg-white/70 backdrop-blur-md p-2 rounded-xl text-xs space-y-1 border border-white/60">
                            ${expenses.filter(e => e.payer === '萍').map((e) => `
                                <div class="flex justify-between"><span>${e.name}</span><span>￥${e.amount} <button onclick="deleteExpense(${expenses.indexOf(e)})" class="text-red-400 ml-1">x</button></span></div>
                            `).join('') || '<span class="text-slate-400">無紀錄</span>'}
                        </div>
                    </div>

                    <!-- 結算提示框 -->
                    <div class="bg-white/90 backdrop-blur-md p-3 rounded-2xl shadow-sm text-center font-bold text-sky-600 border border-white/60 text-sm mt-auto">
                        ${settlementText}
                    </div>
                `;
            }
        }

        // 資料操作函式
        function addRestaurant() {
            const url = document.getElementById('resto-url').value;
            if (!url) return alert('請輸入網址');
            restaurants.push({ name: url.split('/').pop() || 'Google Map 店家', url });
            document.getElementById('resto-url').value = '';
            localStorage.setItem('restaurants', JSON.stringify(restaurants));
            render();
        }
        function deleteRestaurant(i) { restaurants.splice(i, 1); localStorage.setItem('restaurants', JSON.stringify(restaurants)); render(); }

        function addSpot() {
            const name = document.getElementById('spot-url').value;
            if (!name) return alert('請輸入內容');
            spots.push({ name });
            document.getElementById('spot-url').value = '';
            localStorage.setItem('spots', JSON.stringify(spots));
            render();
        }
        function deleteSpot(i) { spots.splice(i, 1); localStorage.setItem('spots', JSON.stringify(spots)); render(); }

        function addExpense() {
            const payer = document.getElementById('exp-payer').value;
            const name = document.getElementById('exp-name').value;
            const amount = document.getElementById('exp-amount').value;
            if (!name || !amount) return alert('請填寫完整');
            expenses.push({ payer, name, amount: Number(amount) });
            localStorage.setItem('expenses', JSON.stringify(expenses));
            render();
        }
        function deleteExpense(i) { expenses.splice(i, 1); localStorage.setItem('expenses', JSON.stringify(expenses)); render(); }

        // 初始化第一次渲染
        render();
    </script>
</body>
</html>
